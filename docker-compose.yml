services:
  db:
    image: postgres:16
    container_name: llm_sql_lab_db
    environment:
      POSTGRES_DB: llm_sql_lab
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  api:
    image: python:3.11-slim
    container_name: llm_sql_lab_api
    working_dir: /workspace
    env_file:
      - .env
    command: bash -lc "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host ${APP_HOST:-0.0.0.0} --port ${APP_PORT:-8000}"
    volumes:
      - ./:/workspace
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
